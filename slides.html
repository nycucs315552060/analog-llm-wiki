<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HTML 教學簡報｜OTA 與 Sizing</title><style>
:root{--bg:#0b1423;--panel:#142238;--panel2:#192a42;--ink:#edf4fd;--muted:#a9bbd1;--accent:#70dbca;--gold:#f3c781;--line:#31445c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 system-ui,-apple-system,"Noto Sans TC",sans-serif}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}.wrap{max-width:1190px;padding:28px;margin:auto}.header{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:19px}.brand{font-weight:850;letter-spacing:.09em;font-size:15px}.links{display:flex;gap:18px;flex-wrap:wrap}.links a{font-size:14px}.hero{padding:60px 0 35px}.tag{color:var(--accent);font-weight:750;font-size:12px;letter-spacing:.16em;text-transform:uppercase}.hero h1{line-height:1.13;letter-spacing:-.045em;font-size:clamp(42px,6vw,72px);max-width:920px;margin:12px 0}.hero p{color:var(--muted);font-size:18px;max-width:780px}.btn{display:inline-block;background:var(--accent);color:#0b1423;border:0;border-radius:11px;padding:11px 19px;font:inherit;font-weight:800;cursor:pointer}.btn.secondary{background:transparent;border:1px solid var(--line);color:var(--ink)}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:23px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:var(--panel);padding:18px;border:1px solid var(--line);border-radius:16px}.stat b{font-size:28px;color:var(--accent)}.stat p{margin:0;color:var(--muted);font-size:13px}.sectiontitle{margin-top:48px}.filters{display:flex;gap:7px;flex-wrap:wrap}.filters button{cursor:pointer;background:var(--panel);color:var(--ink);border:1px solid var(--line);padding:8px 12px;border-radius:22px}.filters button.active{background:var(--accent);color:#061421}.search{width:100%;background:var(--panel);border:1px solid var(--line);padding:13px 16px;color:var(--ink);border-radius:11px;font:inherit}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:15px;margin-top:20px}.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:23px}.card h3{margin:7px 0}.card p{color:var(--muted)}.tiny{font-size:12px;color:var(--accent)}.pill{display:inline-block;border:1px solid var(--line);border-radius:25px;padding:3px 9px;margin:3px;font-size:12px;color:var(--muted)}details{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}summary{cursor:pointer;color:var(--accent)}.sourcebox{border-left:3px solid var(--gold);padding-left:12px;margin:14px 0;color:var(--muted)}.flowbox{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.flowstep{padding:10px 16px;background:var(--panel);border:1px solid var(--line);border-radius:10px}.flowarrow{align-self:center;color:var(--accent)}.note{background:#1a293c;padding:18px;border-radius:12px;border:1px solid var(--line)}footer{margin:60px 0 18px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}@media(max-width:600px){.stats{grid-template-columns:1fr}.header{align-items:flex-start;flex-direction:column}}
body.deck{overflow:hidden}.deck .wrap{max-width:none;padding:0;height:100dvh;display:flex;flex-direction:column}.deck .header{padding:12px 3vw}.deckmain{flex:1;display:flex;align-items:stretch;min-height:0}.slide{width:100%;display:flex;flex-direction:column;justify-content:center;padding:clamp(25px,5vw,85px) clamp(28px,8vw,150px);background:radial-gradient(ellipse at 84% 19%,#24415b 0%,transparent 42%);overflow:auto}.slide h1{font-size:clamp(38px,5.4vw,78px);line-height:1.14;letter-spacing:-.04em;margin:12px 0 24px;max-width:1040px}.slide .summary{font-size:clamp(19px,2.2vw,30px);color:var(--accent);max-width:1100px}.slide ul{font-size:clamp(17px,1.7vw,25px);line-height:1.8;padding-left:1.4em;max-width:1150px}.slide li{padding-left:.1em;margin:7px 0}.formula{display:inline-block;background:#132a3a;border:1px solid #30616a;color:#f2e2b7;padding:15px 25px;border-radius:14px;font-size:clamp(22px,2.7vw,40px);margin:12px 0}.controls{display:flex;align-items:center;gap:13px;padding:12px 3vw;border-top:1px solid var(--line);background:#0b1423}.controls button{background:#1a2a40;color:white;border:1px solid var(--line);padding:7px 15px;border-radius:10px;cursor:pointer;font:inherit}.controls button:disabled{opacity:.4}.controls .right{margin-left:auto}.progress{height:3px;background:#263950}.progress>div{background:var(--accent);height:100%;transition:width .2s}.stage{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin:18px 0}.stage span{padding:15px 20px;border:1px solid var(--line);background:var(--panel);border-radius:12px}.stage i{color:var(--accent);font-style:normal}.quizopts{display:grid;gap:12px;max-width:800px}.quizopts button{color:white;text-align:left;font:inherit;background:var(--panel);border:1px solid var(--line);padding:16px;border-radius:12px;cursor:pointer}.quizopts button.good{border-color:#72d5a9}.quizopts button.bad{border-color:#f49a90}.quizfeedback{min-height:28px;color:var(--gold)}#refs{position:absolute;right:3vw;bottom:70px;background:#152437;border:1px solid var(--line);padding:18px;border-radius:12px;max-width:360px;box-shadow:0 10px 25px #0008}#refs[hidden]{display:none}.deck footer{display:none}@media(max-width:650px){.deck .header{padding:8px 12px}.deck .links{gap:8px}.slide{justify-content:flex-start;padding:30px 23px}.controls{gap:5px}.controls button{padding:5px 9px}}</style></head><body class="deck"><div class="wrap"><header class="header"><div class="brand">◈ ANALOG / LLM WIKI</div><nav class="links"><a href="index.html">Wiki 知識庫</a><a href="slides.html">教學簡報</a><a href="workflow.html">Workflow 與紀錄</a></nav></header><main class="deckmain"><article id="slide" class="slide" aria-live="polite"></article></main><div class="progress"><div id="bar"></div></div><div class="controls"><button id="prev">← 上一頁</button><button id="next">下一頁 →</button><button id="refbtn">Wiki 依據</button><span class="right" id="count"></span><button id="fullscreen">全螢幕</button></div><aside id="refs" hidden></aside><script>const SLIDES=[{"title": "類比電路設計入門", "eyebrow": "ANALOG DESIGN · LESSON 01", "summary": "從 OTA 到 Transistor Sizing", "points": ["不用先會設計電晶體，也能理解整個流程", "以 Two-stage OTA 當作教學案例"], "wiki": ["W01", "W03", "W05"]}, {"title": "今天會學到什麼？", "eyebrow": "LEARNING MAP", "summary": "先理解概念，再理解規格，最後看設計流程。", "points": ["01 OTA：輸入電壓如何變成輸出電流", "02 MOSFET：gm、ro 與增益的關係", "03 Two-stage OTA：為什麼需要多級放大", "04 Gain、GBW、PM：怎麼看設計是否成功", "05 Sizing：改 W/L、模擬與反覆驗證"], "wiki": ["W01", "W02", "W03", "W04", "W05"]}, {"title": "OTA 是什麼？", "eyebrow": "CONCEPT 01", "summary": "OTA 是把「輸入電壓差」轉為「輸出電流」的放大器。", "formula": "Iout = Gm × (Vin+ − Vin−)", "points": ["Vin+、Vin−：差動輸入", "Gm：有效跨導（A/V 或 S）", "輸出電流流經負載阻抗後，就能產生輸出電壓"], "wiki": ["W01"]}, {"title": "MOSFET 如何產生增益？", "eyebrow": "CONCEPT 02", "summary": "小訊號分析用 gm 與 ro 描述 MOSFET 的局部行為。", "formula": "|Av| ≈ gm × Rout", "points": ["gm：輸入電壓微小變化造成多少電流變化", "ro：輸出端的等效小訊號電阻（單顆 MOSFET）", "Rout：整個輸出節點的等效電阻；此式只適用於簡化單級模型"], "wiki": ["W02"]}, {"title": "Two-stage OTA 的訊號路徑", "eyebrow": "ARCHITECTURE", "summary": "第一級處理差動輸入，第二級增加增益並驅動負載。", "points": ["差動輸入級 → 內部節點 → 第二增益級 → 輸出", "Bias 提供適當的工作電流", "Compensation 控制頻率響應與穩定性"], "diagram": "stages", "wiki": ["W03"]}, {"title": "規格 ① Gain 與 GBW", "eyebrow": "PERFORMANCE", "summary": "Gain 代表放大能力；GBW 關聯速度與頻寬。", "formula": "Gain (dB) = 20 log₁₀|Av|", "points": ["DC Gain：低頻時放大訊號的能力", "GBW：常用於描述單主極點補償放大器的速度", "不能假設所有放大器都有相同的 gain × bandwidth 乘積"], "wiki": ["W04"]}, {"title": "規格 ② Phase Margin", "eyebrow": "STABILITY", "summary": "放大器有增益還不夠；回授後還要避免振盪。", "points": ["PM 在 loop gain 的 0 dB 交越頻率處定義", "PM 太低可能造成振鈴或不穩定", "補償電容可改變極點位置，影響 GBW 與 PM"], "wiki": ["W04", "W03"]}, {"title": "Transistor Sizing 在做什麼？", "eyebrow": "DESIGN LOOP", "summary": "在既定拓樸與 PDK 下調整設計參數，以滿足多項性能規格。", "points": ["設計變數：W、L、Bias（依設計自由度）", "評估指標：Gain、GBW、PM、Power 等", "改大 W 不保證所有規格一起變好"], "wiki": ["W05"]}, {"title": "模擬工具：Netlist / PDK / SPICE", "eyebrow": "TOOLS", "summary": "電路的行為不能只靠公式猜測，需要依正確製程模型模擬。", "points": ["Netlist：列出元件、連接與參數", "PDK：提供製程相依的裝置模型與限制", "SPICE：用 DC、AC、Transient 等分析檢查設計"], "wiki": ["W06"]}, {"title": "Sizing 的完整 Loop", "eyebrow": "WORKFLOW", "summary": "每次修改參數後都要再次驗證所有相關規格。", "diagram": "loop", "points": ["設定規格 → 設定 W/L 與偏壓 → SPICE 模擬", "檢查 DC 工作點與 Gain / GBW / PM / Power", "未達標 → 分析 trade-off → 修改參數 → 再模擬"], "wiki": ["W05", "W07"]}, {"title": "實作案例：如何判斷要不要重試？", "eyebrow": "THINK LIKE AN ENGINEER", "summary": "以下是假設性教學範例，不是實測數據。", "points": ["目標：Gain ≥ 60 dB、GBW ≥ 10 MHz、PM ≥ 60°", "假設結果：Gain = 65 dB、GBW = 12 MHz、PM = 45°", "判斷：Gain / GBW 達標，但 PM 未達標；應檢查補償與相關 trade-off，再模擬"], "wiki": ["W04", "W05", "W07"]}, {"title": "快速測驗", "eyebrow": "CHECK YOUR UNDERSTANDING", "summary": "哪一個敘述最正確？", "quiz": {"question": "把 MOSFET 的 W 加大，就一定能同時改善 Gain、GBW 和 PM？", "options": ["正確，尺寸越大越好", "錯誤，規格間有權衡，需模擬驗證"], "correct": 1, "explanation": "Sizing 會同時影響多項電氣特性，因此不能只靠單一參數方向推斷全部結果。"}, "wiki": ["W05", "W07"]}, {"title": "總結：從知識走向設計", "eyebrow": "TAKEAWAYS", "summary": "理解 OTA → 了解指標 → 用 PDK 與 SPICE 反覆驗證。", "points": ["OTA 用跨導把差動電壓轉換成電流", "Gain、GBW、PM 分別描述不同的表現", "Sizing 是受製程和多目標限制的迭代問題", "每頁可以點擊「Wiki 依據」追查知識來源"], "wiki": ["W01", "W04", "W05", "W07"]}],WIKI=[{"id": "W01", "title": "OTA 是什麼？", "category": "基礎概念", "sources": ["S01", "S02"], "definition": "OTA (Operational Transconductance Amplifier) 是把差動輸入電壓轉為輸出電流的放大器。", "body": "簡化關係：Iout = Gm(Vin+ − Vin−)。Gm 是整個 OTA 的有效跨導，單位 S。若把 OTA 的輸出接到負載阻抗，就能將輸出電流轉換為電壓。", "pitfall": "OTA 的原生輸出通常是電流；不能直接把它和所有電壓輸出 op amp 視為一樣。"}, {"id": "W02", "title": "MOSFET 的 gm 與 ro", "category": "電晶體", "sources": ["S03"], "definition": "gm 是工作點附近 ∂Id/∂Vgs；ro 是工作點附近的輸出電阻。", "body": "在小訊號與合適偏壓條件下，單級電壓增益量值常近似 gm × Rout；Rout 為輸出節點等效電阻，不一定只是一顆 MOSFET 的 ro。", "pitfall": "gm × ro 只是特定簡化模型的近似，不能無條件套用到整個多級 OTA。"}, {"id": "W03", "title": "Two-stage OTA 的組成", "category": "電路架構", "sources": ["S02", "S05"], "definition": "兩級 OTA 常由差動輸入級及後續增益級組成，並可能加入補償網路。", "body": "輸入級將差動訊號轉成電流/內部節點電壓，第二級放大訊號並驅動負載；實作時須兼顧偏壓、輸出擺幅與補償。", "pitfall": "two-stage OTA 不等於必然穩定；仍須確認負回授條件與補償。"}, {"id": "W04", "title": "Gain、GBW 與 Phase Margin", "category": "規格", "sources": ["S04", "S05"], "definition": "Gain 是增益；GBW 是常用頻寬相關指標；PM 用來描述回授迴路的穩定裕度。", "body": "增益可用 dB 表示：20 log10|Av|。對單主極點近似成立的系統，GBW 與低頻增益及頻寬有近似乘積關係。PM 應由 loop gain 的相位在 0 dB 交越頻率處求得。", "pitfall": "不能只憑 GBW 判斷閉迴路穩定；PM 也不是所有 OTA 都能直接由 open-loop 增益曲線推得。"}, {"id": "W05", "title": "Transistor Sizing 是什麼？", "category": "設計流程", "sources": ["S03", "S06", "S07"], "definition": "Transistor sizing 是在固定電路架構與製程條件下，調整 MOSFET 的 W、L 與偏壓等設計變數，以滿足規格。", "body": "調整尺寸會改變偏壓、電容、gm、ro 與速度/功耗權衡。合理流程是定義規格→指定 PDK→初始化 W/L→SPICE 模擬→比較規格→調整重試。", "pitfall": "加大 W 不保證 Gain、GBW、PM 都同時改善。"}, {"id": "W06", "title": "Netlist、PDK 與 SPICE", "category": "工具", "sources": ["S06", "S07"], "definition": "Netlist 描述元件與連接；PDK 提供製程元件/模型；SPICE 用模型計算電路響應。", "body": "模擬中常以 DC 找偏壓工作點、AC 求小訊號頻率響應、Transient 檢查時域行為。模型與電路條件不同，數值不能直接類推。", "pitfall": "示意公式不等於製程簽核結果；最後仍須根據正確 PDK 與 SPICE 驗證。"}, {"id": "W07", "title": "初學者的設計迴圈", "category": "教學流程", "sources": ["S03", "S04", "S05", "S07"], "definition": "規格→設計→模擬→檢查→調整是一個可重複的 sizing loop。", "body": "先確認規格與單位，再檢查 DC 工作點是否合理，接著檢視 gain/GBW/PM/功耗；當某一項未達標時，應檢視造成限制的可能原因並再次模擬。", "pitfall": "只檢查單一 spec 容易忽略其他規格惡化。"}],SOURCES=[{"id": "S01", "title": "Transconductance Amplifier", "publisher": "Analog Devices", "url": "https://www.analog.com/en/resources/glossary/transconductance_amplifier.html", "topic": "OTA", "summary": "跨導放大器以輸入電壓差控制輸出電流；OTA 是常見的跨導放大器類型。", "facts": ["跨導的單位為西門子 S (= A/V)。", "簡化關係為 Iout = Gm × (Vin+ − Vin−)。"], "status": "curated_from_public_source"}, {"id": "S02", "title": "Activity: 2 Stage CMOS OTA", "publisher": "Analog Devices Wiki", "url": "https://wiki.analog.com/university/courses/alm1k/alm-lab-ota", "topic": "Architecture", "summary": "以兩級 CMOS OTA 作為入門案例，理解差動輸入級與第二增益級。", "facts": ["兩級 OTA 可用多個電晶體增益級達成較大的電壓增益。", "輸入差動對將電壓差轉換為電流變化。"], "status": "curated_from_public_source"}, {"id": "S03", "title": "Small-Signal MOSFET Models for Analog IC Design", "publisher": "All About Circuits", "url": "https://www.allaboutcircuits.com/technical-articles/small-signal-mosfet-models-for-analog-ic-design/", "topic": "MOSFET", "summary": "MOSFET 小訊號等效模型可用跨導 gm 與輸出電阻 ro 近似放大器行為。", "facts": ["gm 表示汲極電流對閘源電壓的局部變化率。", "在合適的偏壓與小訊號條件下，單級電壓增益的大小可近似為 gm × Rout。"], "status": "curated_from_public_source"}, {"id": "S04", "title": "Understanding Operational Amplifier Specifications", "publisher": "Texas Instruments", "url": "https://www.ti.com/lit/an/sloa011b/sloa011b.pdf", "topic": "Specifications", "summary": "介紹常見放大器規格，包括直流增益、gain-bandwidth product 與 phase margin。", "facts": ["GBW 是理解單主極點補償放大器速度的常見指標。", "PM 反映迴路在增益交越附近的相位裕度，需在指定回授條件下解讀。"], "status": "curated_from_public_source"}, {"id": "S05", "title": "An overview on basic operational amplifier stability", "publisher": "Texas Instruments", "url": "https://www.ti.com/lit/an/slyt858/slyt858.pdf", "topic": "Stability", "summary": "說明迴路穩定度、主極點與補償電容如何影響 GBW 與 phase margin。", "facts": ["相位裕度過小可能導致閉迴路振鈴或不穩定。", "Miller 補償改變主極點位置，也可能影響單位增益頻寬與相位裕度。"], "status": "curated_from_public_source"}, {"id": "S06", "title": "SkyWater SKY130 PDK — Device Details", "publisher": "SkyWater", "url": "https://skywater-pdk.readthedocs.io/en/main/rules/device-details.html", "topic": "PDK", "summary": "提供 SKY130 製程元件資訊與模型名稱；實際 sizing 應受製程/模型約束。", "facts": ["PDK 提供製程相關的元件與模型資訊。", "設計者須依據實際器件限制及模擬結果選擇 W/L。"], "status": "curated_from_public_source"}, {"id": "S07", "title": "SkyWater SKY130 PDK — File Types", "publisher": "SkyWater", "url": "https://skywater-pdk.readthedocs.io/en/main/contents/file_types.html", "topic": "Simulation", "summary": "說明 netlist、device models 與 SPICE 模擬相關的檔案格式。", "facts": ["電晶體層級 netlist 描述電路連接與元件參數。", "SPICE 模型可用於驗證設計的電氣性能。"], "status": "curated_from_public_source"}];let index=0;const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function draw(){const s=SLIDES[index];$('#refs').hidden=true;let diagram=s.diagram==='stages'?'<div class="stage"><span>Vin+ / Vin−</span><i>→</i><span>差動輸入級</span><i>→</i><span>第二增益級</span><i>→</i><span>Vout</span></div>':s.diagram==='loop'?'<div class="stage"><span>規格</span><i>→</i><span>選 W/L</span><i>→</i><span>SPICE</span><i>→</i><span>檢查</span><i>↺</i><span>修正參數</span></div>':'';let quiz=s.quiz?`<div class="quizopts">${s.quiz.options.map((o,i)=>`<button data-opt="${i}">${esc(o)}</button>`).join('')}</div><div class="quizfeedback" id="quizfb"></div>`:'';$('#slide').innerHTML=`<div class="tag">${esc(s.eyebrow)}</div><h1>${esc(s.title)}</h1><p class="summary">${esc(s.summary)}</p>${s.formula?`<div><div class="formula">${esc(s.formula)}</div></div>`:''}${diagram}<ul>${(s.points||[]).map(t=>`<li>${esc(t)}</li>`).join('')}</ul>${quiz}`;if(s.quiz){$('#slide').addEventListener('click',quizClick,{once:false});}$('#bar').style.width=((index+1)/SLIDES.length*100)+'%';$('#count').textContent=`${String(index+1).padStart(2,'0')} / ${SLIDES.length}`;$('#prev').disabled=index===0;$('#next').disabled=index===SLIDES.length-1;location.hash='slide-'+(index+1);}funct
